faqs:
  - question: Which makes of valve do you repair?
    answer: Any make. We repair valves, actuators, cylinders and positioners of any make and model.
  - question: How long does a valve repair take?
    answer: Typically 2–3 days when the valve is repaired at our workshop.
  - question: How do I send a valve for repair?
    answer: Call us or send a WhatsApp photo of the valve and its nameplate, and tell us what is wrong with it. We will tell you what to do next and where to send it.
  - question: Do you repair actuators and positioners as well as valves?
    answer: Yes. We repair pneumatic and electric actuators, power cylinders and positioners of any make, on their own or together with the valve.
  - question: Do you offer on-site service?
    answer: Yes, across North India. Where the work needs our workshop, a typical repair takes 2–3 days.
  - question: Is the valve tested after repair?
    answer: Yes. Every unit is tested before dispatch, and you get a report of the work done.
  - question: What if the valve cannot be repaired?
    answer: We will tell you, and can supply a replacement. We supply new valves, surplus and discontinued valves and parts, and reconditioned components.
