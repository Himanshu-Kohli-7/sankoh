title: Valve Repair
h1: Valve Repair Services — Any Make, Any Model
seoTitle: Valve Repair Services
metaDescription: Valve repair for any make – control, globe, gate, butterfly, ball and plug valves, actuators and positioners. On site or in our workshop, 6-month warranty.
updated: 2026-11-14
group: valve
serviceType: Industrial valve repair
intro: >-
  Sankoh Technical Solutions repairs valves of any make, manual and automated, along with their actuators, cylinders and positioners.
  We repair on site or in our workshop, where a repair typically takes 2–3 days, and repaired valves carry a 6-month warranty.
  Send us a photo of the valve and its nameplate and our engineers will tell you what it needs.

# One line per subpage: the symptoms that bring each type in. General knowledge only.
services:
  - href: /valve-repair/control-valve-repair/
    summary: For control valves that leak through, stick or hunt around the set point.
  - href: /valve-repair/actuator-cylinder-repair/
    summary: For pneumatic and electric actuators and power cylinders that leak air, lose force or fail to stroke.
  - href: /valve-repair/positioner-repair-calibration/
    summary: For positioners that drift, hunt or no longer follow the control signal.
  - href: /valve-repair/globe-valve-repair/
    summary: For globe valves that pass when shut, leak at the gland or are hard to turn.
  - href: /valve-repair/gate-valve-repair/
    summary: For gate valves with a jammed gate, a damaged stem or a leaking gland.
  - href: /valve-repair/butterfly-valve-repair/
    summary: For butterfly valves with a worn seat, a leaking shaft seal or a stiff disc.
  - href: /valve-repair/ball-valve-repair/
    summary: For ball valves that leak through the seats, leak at the stem or have seized.
  - href: /valve-repair/plug-valve-repair/
    summary: For plug valves that have seized, pass when shut or leak at the stem.

repairVsReplace:
  intro: >-
    A repair is usually worth it when the valve body is sound and the fault is in parts that wear.
    Replacing makes more sense when the body itself is damaged or the valve no longer suits the duty.
    If you are not sure, send us a photo and the nameplate details and we will advise.
  repair:
    - The body and bonnet are sound, and the fault is in wearing parts such as seats, seals, packing or trim.
    - The valve is a large, special or automated unit that is costly or slow to buy new.
    - The make or model is discontinued and a like-for-like replacement is hard to find.
    - You need the line back quickly. A typical workshop repair is done in 2–3 days.
  replace:
    - The body is cracked, badly corroded or eroded.
    - The valve was the wrong type, size or material for the service and keeps failing.
    - It is a small, standard valve and a new one costs less than the repair.
    - The process conditions have changed since the valve was installed.
