# Checklist labels for "What to send us". Asks the customer for details; makes no claim.
whatToSend:
  - Photo of the valve and its nameplate
  - Make and model
  - Valve type and size
  - What is wrong with it
  - Media, pressure and temperature
  - Actuator or positioner fitted
  - Number of units
  - Your location, for on-site repair

# Company facts only (CLAUDE.md §4). The fact strip above already covers make, turnaround, breakdown support and team.
