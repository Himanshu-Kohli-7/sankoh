[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Quote form endpoint (netlify/functions/quote.ts, served at /api/quote).
# Set in the Netlify UI only, never in the repo: TURNSTILE_SECRET_KEY, EMAIL_USER, EMAIL_PASS.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Canonical host is www (existing redirect, kept from the old site).
[[redirects]]
  from = "https://sankohtech.com/*"
  to = "https://www.sankohtech.com/:splat"
  status = 301
  force = true

