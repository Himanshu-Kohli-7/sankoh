[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Quote form endpoint (netlify/functions/quote.ts, served at /api/quote).
# Set in the Netlify UI only, never in the repo: TURNSTILE_SECRET_KEY, EMAIL_USER, EMAIL_PASS.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# IndexNow: ping changed URLs after each production deploy (local plugin, no npm package).
[[plugins]]
  package = "/netlify/plugins/indexnow"

# Old-site URLs (SPEC §10). The old site was a client-side app on /, /about, /services, /products,
# /contact, with categories in the query string. Every target is the final absolute www URL, so a
# www request takes one hop. These come before the apex rule. Full table: docs/REDIRECTS.md.
#
# Query rules need force = true: /products/index.html exists and would otherwise shadow them.
# More specific rules (category + subcategory) come first; Netlify uses the first match.
# Netlify carries the old query string over (/products/manual-valves/?category=manual-valves): still
# one hop to a 200, and the page's canonical has no query. Bare category=automated-valves,
# process-instruments, instruments or any other value are NOT redirected: a rule back to /products/
# would match its own target (the query is carried) and loop. /products/ ignores the query.

[[redirects]]
  from = "/products"
  query = {category = "automated-valves", subcategory = "pneumatic"}
  to = "https://www.sankohtech.com/products/pneumatic-actuated-valves/"
  status = 301
  force = true

[[redirects]]
